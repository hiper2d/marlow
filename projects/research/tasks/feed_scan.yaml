# feed_scan - scan Marlow's research sources for new entries.
#
# The source list is HERS (Alex, 2026-11-07): projects/research/feeds/sources.yaml.
# The scheduler expands it into one subtask per source (process_rss_feed or
# process_sitemap_feed by `kind`). Changes go through tools/sources.py, which
# validates the feed and logs to projects/research/feeds/sources-log.md.
#
# Cadence: daily at 7:00 UTC, one source per tick.
name: feed_scan
project: research
profile: writer
description: Scan Marlow's own research sources (RSS + sitemap) for new entries.
schedule: "0 7 * * *"
priority: normal
sources_file: projects/research/feeds/sources.yaml
