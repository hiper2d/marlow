# scrape_stats — console scraping for the 8 Werewolf providers with no usable
# balance/cost API (so they can't ride monitor_keys):
#   - GLM / Z.AI : cash + credits balance        (a real depleting balance)
#   - Gemini     : prepaid credit balance        (a real depleting balance).
#                  Was spend-vs-tier-cap until Alex moved the billing account to
#                  prepay (2026-08-27). The old pair was actively misleading
#                  after that: "$22.62 of $2000 (1%)" on a day the balance was
#                  $9.83. The number is on aistudio.google.com/billing but NOT
#                  in that page's DOM — it renders inside an embedded
#                  payments.google.com iframe, read via the browser CLI's
#                  `--frame`. Month-to-date cost is kept as context only.
#   - Mistral    : month usage vs. $30 spending limit (postpaid; + pending)
#   - Sakana Fugu: prepaid credit balance        (a real depleting balance)
#   - MiniMax    : prepaid effective balance     (a real depleting balance)
#   - OpenAI     : prepaid credit balance        (a real depleting balance)
#   - Anthropic  : prepaid credit balance        (a real depleting balance)
#   - Qwen       : month spend, postpaid and UNCAPPED. QwenCloud gave 1M free
#                  tokens per model for 90 days; all three models the game uses
#                  (qwen3.8-max, qwen3.7-plus, qwen3.7-flash) exhausted theirs
#                  around 2026-08-25, and with auto-stop off the calls rolled
#                  onto pay-as-you-go rather than failing. So the headline is
#                  now dollars from home.qwencloud.com/billing/overview, with
#                  percent-of-grant demoted to a sub-note. The handler switches
#                  on the data, not on a date: while a grant has tokens left,
#                  percent is still the headline.
#
# Once daily — these move slower than the free-tier balance keys, and each run
# drives a headless Chrome (~40s), so twice-daily isn't worth it.
#
# Mechanism: a DEDICATED persistent Chrome profile (port 9223) that Alex logged
# into once; the handler runs it headless and reuses the cookies. Driving goes
# through simona's browser CLI (CDP_PORT=9223). HTML scrapes are fragile by
# nature — a console redesign breaks an extractor. Failures are explicit:
#   - reauth      (login wall, session expired)  → urgent
#   - parse_failed (number not found / layout changed) → digest
#   - chrome_down (profile unreachable)          → urgent
# Never a silent wrong number. Every read that comes up empty is retried once
# with a longer settle first — a cold headless Chrome can simply not have
# painted yet, which is indistinguishable from a redesign on a single read.
#
# BOT-CHALLENGE NOTE: the headless profile masks its user agent to plain Chrome
# (start-chrome-persistent.sh). Headless Chrome's default UA gets an OpenAI
# Cloudflare interstitial and an EMPTY page body, which the handler can only
# report as `parse_failed: no credit balance found` — that ran for two days
# before anyone read it as a bot block (2026-08-26/27). If a console suddenly
# returns nothing at all, check for a challenge before rewriting the extractor.
#
# RE-AUTH RUNBOOK (when Marlow reports a `reauth` issue):
#   1. Kill the headless instance:  pkill -f "user-data-dir=$HOME/.config/marlow/scrape-profile"
#      Then CONFIRM it is gone (`pgrep -f scrape-profile`) — a survivor keeps
#      the port and the relaunch silently no-ops on the old flags.
#   2. Launch headful:  bash <simona>/mcp/browser/start-chrome-persistent.sh 9223
#   3. Log back into the flagged console in that window, then quit it.
#   4. Next tick relaunches headless and reuses the refreshed cookies.
#
# In-tick flow:
#   1. Run `uv run python handlers/scrape_stats.py report`.
#   2. Parse JSON. Write it to projects/werewolf-ops/reports/scrape/<YYYY-MM-DD>.md.
#   3. If any_urgent (reauth / near_cap >=95% / balance_critical /
#      quota_critical / quota_exhausted / chrome_down), send one consolidated
#      urgent Telegram. For reauth, include the runbook.
#   4. Else if digest-severity issues (balance_low, approaching_cap, quota_low,
#      quota_expiring, parse_failed), append a digest line.
#   5. If clean, append NOTHING to the digest. Do NOT write a roll-call of
#      provider figures — `compose_daily_digest` appends one consolidated block
#      covering all 11 providers at send time, built from the saved snapshots
#      (driver/budget_state.py). Splitting the roll-call between this task and
#      monitor_keys meant no single digest entry ever showed Alex what was left
#      on each key, which is the only question this subsystem exists to answer
#      (2026-08-27). Report issues; the balances are somebody else's job now.
#   6. Write the tick result and exit.
name: scrape_stats
project: werewolf-ops
profile: ops
description: Daily console scrape of the 8 no-API Werewolf providers (GLM, Gemini, Sakana, MiniMax, OpenAI, Anthropic balances; Mistral spend-vs-cap; Qwen postpaid spend) via a logged-in headless Chrome.
schedule: "0 9 * * *"
priority: normal
must_run_within_hours: 12
subtasks:
  - id: scrape_consoles
    handler: scrape_stats
    context: {}
