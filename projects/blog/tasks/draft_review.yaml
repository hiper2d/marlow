# draft_review — the weekly writing slot.
#
# Fires once a week, Mondays at 14:00 UTC. Marlow writes ONE piece on anything
# she wants (Alex, 2026-10-28): it does not have to come from the news feed or a
# ripe research thread, or be about AI at all. The bar is quality, not topic
# (memory/topic-guidance.md). HARD CAP: one draft per cycle, so the blog stays at
# one publication a week (Alex's call, 2026-06-23). A pending research
# assignment from Alex is weighed first. If she genuinely has nothing that week
# she skips and tells Alex in the chat; that should be rare.
#
# Once a draft is written it sits silently in projects/blog/drafts/ with
# status:draft. The `blog_pipeline` task (every 4 hours) picks it up, runs
# self-review, and advances it through revise -> publish.
#
# In-tick flow: profiles/writer/IDENTITY.md -> "Drafting articles".
name: draft_review
project: blog
profile: writer
description: Weekly writing slot; Marlow drafts one piece on anything she wants.
schedule: "0 14 * * 1"   # weekly, Mondays 14:00 UTC (was every 3 days; throttled to ≤1 publication/week 2026-06-23)
priority: normal
must_run_within_hours: 36
subtasks:
  - id: review_and_draft
    handler: draft_article
    context: {timeout_sec: 900}   # full draft+image+self-review flow; 300s killed it mid-draft (failed every run since 05-31)
